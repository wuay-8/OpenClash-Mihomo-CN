# ============================================================
# OpenClash-Mihomo-CN V3
# 调整：
#   - 英国 / 德国 / 法国不再单独分组
#   - Telegram 增加 节点选择
#   - Airport 层全局删除流量 / 到期 / 套餐等信息节点
#   - 其他地区只显示未被现有地区分组收纳的真实国家/地区节点
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
external-controller: 0.0.0.0:9090
secret: ''
profile:
  store-selected: true
  store-fake-ip: true
geo-auto-update: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - +.push.apple.com
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.local
    - +.home.arpa
    - localhost.ptlogin2.qq.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - ntp.*.com
    - '*.ntp.org.cn'
    - +.pool.ntp.org
    - stun.*.*
    - stun.*.*.*
    - +.stun.*.*
    - +.stun.*.*.*
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - xbox.*.microsoft.com
    - +.push.apple.com
proxy-providers:
  Airport:
    type: http
    url: https://example.com/YOUR_SUBSCRIPTION_URL
    path: ./proxy_providers/Airport.yaml
    interval: 21600
    proxy: DIRECT
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 手动切换
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
      - 韩国
      - 其他地区
      - DIRECT
  - name: 手动切换
    type: select
    use:
      - Airport
  - name: 规则下载
    type: select
    proxies:
      - 节点选择
      - 手动切换
  - name: 香港
    type: select
    use:
      - Airport
    filter: (?i)香港|Hong.?Kong|\bHK\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 日本
    type: select
    use:
      - Airport
    filter: (?i)日本|Japan|Tokyo|Osaka|\bJP\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 美国
    type: select
    use:
      - Airport
    filter: (?i)美国|United.?States|Los.?Angeles|San.?Jose|\bUS\b|\bUSA\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 新加坡
    type: select
    use:
      - Airport
    filter: (?i)新加坡|Singapore|\bSG\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 台湾
    type: select
    use:
      - Airport
    filter: (?i)台湾|臺灣|Taiwan|\bTW\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 韩国
    type: select
    use:
      - Airport
    filter: (?i)韩国|韓國|Korea|Seoul|\bKR\b
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
  - name: 其他地区
    type: select
    use:
      - Airport
    exclude-filter: (?i)香港|Hong.?Kong|\bHK\b|日本|Japan|Tokyo|Osaka|\bJP\b|美国|United.?States|Los.?Angeles|San.?Jose|\bUS\b|\bUSA\b|新加坡|Singapore|\bSG\b|台湾|臺灣|Taiwan|\bTW\b|韩国|韓國|Korea|Seoul|\bKR\b
  - name: 国际流量
    type: select
    proxies:
      - 节点选择
      - 手动切换
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
      - 韩国
      - 其他地区
  - name: 国内流量
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: AI服务
    type: select
    proxies:
      - 美国
      - 新加坡
      - 日本
      - 节点选择
      - 手动切换
  - name: YouTube
    type: select
    proxies:
      - 节点选择
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 手动切换
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
      - 韩国
      - 其他地区
      - DIRECT
  - name: Telegram
    type: select
    proxies:
      - 新加坡
      - 香港
      - 日本
      - 美国
      - 节点选择
  - name: Google
    type: select
    proxies:
      - 节点选择
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
  - name: Google FCM
    type: select
    proxies:
      - 节点选择
      - DIRECT
      - 香港
      - 日本
      - 美国
      - 新加坡
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 香港
      - 日本
      - 美国
      - 新加坡
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 香港
      - 日本
      - 美国
      - 新加坡
      - 台湾
  - name: PayPal
    type: select
    proxies:
      - 美国
      - 节点选择
      - 香港
      - 新加坡
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 香港
      - 日本
      - 新加坡
      - 美国
  - name: WeChat
    type: select
    proxies:
      - DIRECT
      - 节点选择
