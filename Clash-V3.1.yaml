  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - RULE-SET,AdBlock,广告拦截
  - DOMAIN-SUFFIX,claude.ai,AI服务
  - DOMAIN-SUFFIX,anthropic.com,AI服务
  - DOMAIN-SUFFIX,perplexity.ai,AI服务
  - DOMAIN,gemini.google.com,AI服务
  - RULE-SET,AI,AI服务
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Netflix,国外媒体
  - RULE-SET,Disney,国外媒体
  - RULE-SET,Max,国外媒体
  - RULE-SET,Spotify,国外媒体
  - RULE-SET,Bahamut,国外媒体
  - RULE-SET,Bilibili,国内流量
  - RULE-SET,Telegram,Telegram
  - RULE-SET,GoogleFCM,Google FCM
