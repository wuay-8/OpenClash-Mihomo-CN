# ============================================================
# OpenClash + Mihomo 中国大陆融合版 V2.1（无自动测速分组）
# 使用前只需要修改 Airport 的 url
# 说明：
#   - 已移除 ♻️ 自动选择
#   - 已移除 HK / JP / US / SG / TW Auto
#   - 地区组全部改为手动选择
#   - 保留 Airport health-check，仅用于节点可用性检测
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
external-controller: 0.0.0.0:9090
secret: ''
profile:
  store-selected: true
  store-fake-ip: true
geo-auto-update: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.local
  - +.home.arpa
  - localhost.ptlogin2.qq.com
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - '*.ntp.org.cn'
  - +.pool.ntp.org
  - stun.*.*
  - stun.*.*.*
  - +.stun.*.*
  - +.stun.*.*.*
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - xbox.*.microsoft.com
proxy-providers:
  Airport:
    type: http
    url: https://example.com/YOUR_SUBSCRIPTION_URL
    path: ./proxy_providers/Airport.yaml
    interval: 21600
    proxy: DIRECT
    exclude-filter: (?i)流量|剩余|到期|过期|Traffic|Expire|官网|套餐|重置
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🚀 手动切换
  - 🇭🇰 Hong Kong
  - 🇯🇵 Japan
  - 🇺🇸 United States
  - 🇸🇬 Singapore
  - 🇹🇼 Taiwan
  - 🇰🇷 Korea
  - 🇬🇧 United Kingdom
  - 🇩🇪 Germany
  - 🇫🇷 France
  - 🌍 Other Regions
  - DIRECT
- name: 🚀 手动切换
  type: select
  use:
  - Airport
- name: 🔧 规则下载
  type: select
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
- name: 🇭🇰 Hong Kong
  type: select
  use:
  - Airport
  filter: (?i)香港|港|HK|Hong.?Kong
- name: 🇯🇵 Japan
  type: select
  use:
  - Airport
  filter: (?i)日本|日|JP|Japan|Tokyo|Osaka
- name: 🇺🇸 United States
  type: select
  use:
  - Airport
  filter: (?i)美国|美|US|USA|United.?States|Los.?Angeles|San.?Jose
- name: 🇸🇬 Singapore
  type: select
  use:
  - Airport
  filter: (?i)新加坡|新|SG|Singapore
- name: 🇹🇼 Taiwan
  type: select
  use:
  - Airport
  filter: (?i)台湾|臺灣|台|TW|Taiwan
- name: 🇰🇷 Korea
  type: select
  use:
  - Airport
  filter: (?i)韩国|韓國|韩|KR|Korea|Seoul
- name: 🇬🇧 United Kingdom
  type: select
  use:
  - Airport
  filter: (?i)英国|英|UK|GB|United.?Kingdom|London
- name: 🇩🇪 Germany
  type: select
  use:
  - Airport
  filter: (?i)德国|德|DE|Germany|Frankfurt
- name: 🇫🇷 France
  type: select
  use:
  - Airport
  filter: (?i)法国|法|FR|France|Paris
- name: 🌍 Other Regions
  type: select
  use:
  - Airport
  exclude-filter: (?i)香港|Hong.?Kong|\bHK\b|日本|Japan|\bJP\b|美国|United.?States|\bUS\b|\bUSA\b|新加坡|Singapore|\bSG\b|台湾|臺灣|Taiwan|\bTW\b|韩国|韓國|Korea|\bKR\b|英国|United.?Kingdom|\bUK\b|\bGB\b|德国|Germany|\bDE\b|法国|France|\bFR\b|流量|剩余|到期|过期|Traffic|Expire
